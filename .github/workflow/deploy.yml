name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # 允许你在Actions页面手动触发

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # 根据你的项目需要调整版本
          cache: 'pnpm' # 如果使用 yarn 或 pnpm，请对应改为 'yarn' 或 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile # 对应 yarn install --frozen-lockfile 或 pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm build # 执行项目的构建脚本

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # 请将此处替换为你项目的实际构建输出目录（如 build, public 等）

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4